nchor="middle" fill="#1b1b1b">режим, 16 МБ</text><circle cx="248" cy="180" r="7" fill="#fff1e6" stroke="#e8590c" stroke-width="2"/><line x1="248" y1="188" x2="248" y2="210" stroke="#868e96" stroke-width="1.2"/><text x="248" y="228" font-size="12" text-anchor="middle" fill="#e8590c" font-weight="bold">1985</text><text x="248" y="244" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">80386</text><text x="248" y="260" font-size="10.5" text-anchor="middle" fill="#1b1b1b">32 бит, страницы,</text><text x="248" y="274" font-size="10.5" text-anchor="middle" fill="#1b1b1b">4 ГБ</text><circle cx="314" cy="180" r="7" fill="#fff1e6" stroke="#e8590c" stroke-width="2"/><line x1="314" y1="172" x2="314" y2="150" stroke="#868e96" stroke-width="1.2"/><text x="314" y="86" font-size="12" text-anchor="middle" fill="#e8590c" font-weight="bold">1989</text><text x="314" y="102" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">80486</text><text x="314" y="118" font-size="10.5" text-anchor="middle" fill="#1b1b1b">конвейер,</text><text x="314" y="132" font-size="10.5" text-anchor="middle" fill="#1b1b1b">кэш L1, FPU</text><circle cx="380" cy="180" r="7" fill="#fff1e6" stroke="#e8590c" stroke-width="2"/><line x1="380" y1="188" x2="380" y2="210" stroke="#868e96" stroke-width="1.2"/><text x="380" y="228" font-size="12" text-anchor="middle" fill="#e8590c" font-weight="bold">1993</text><text x="380" y="244" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">Pentium</text><text x="380" y="260" font-size="10.5" text-anchor="middle" fill="#1b1b1b">суперскаляр:</text><text x="380" y="274" font-size="10.5" text-anchor="middle" fill="#1b1b1b">2 конвейера</text><circle cx="446" cy="180" r="7" fill="#fff1e6" stroke="#e8590c" stroke-width="2"/><line x1="446" y1="172" x2="446" y2="150" stroke="#868e96" stroke-width="1.2"/><text x="446" y="86" font-size="12" text-anchor="middle" fill="#e8590c" font-weight="bold">1995</text><text x="446" y="102" font-