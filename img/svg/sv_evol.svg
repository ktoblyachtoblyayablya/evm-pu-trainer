6" stroke="#e8590c" stroke-width="2"/><line x1="710" y1="172" x2="710" y2="150" stroke="#868e96" stroke-width="1.2"/><text x="710" y="86" font-size="12" text-anchor="middle" fill="#e8590c" font-weight="bold">2020</text><text x="710" y="102" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">Apple M1</text><text x="710" y="118" font-size="10.5" text-anchor="middle" fill="#1b1b1b">SoC ARM,</text><text x="710" y="132" font-size="10.5" text-anchor="middle" fill="#1b1b1b">big.LITTLE 4+4</text><text x="380" y="25" font-size="12" text-anchor="middle" fill="#1b1b1b"></text><text x="380" y="330" font-size="12" text-anchor="middle" fill="#868e96">Разрядность и адресное пространство → защита памяти → конвейер и кэш → суперскаляр и внеочередное</text><text x="380" y="348" font-size="12" text-anchor="middle" fill="#868e96">выполнение → многоядерность → системы на кристалле с разнотипными ядрами</text></svg>