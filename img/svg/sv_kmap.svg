8590c" font-weight="bold">f = b̄·d̄ + b·d</text><text x="425" y="252" font-size="13" text-anchor="start" fill="#868e96">Соседние клетки отличаются одной переменной;</text><text x="425" y="270" font-size="13" text-anchor="start" fill="#868e96">группа из 2^k единиц убирает k переменных.</text></svg>