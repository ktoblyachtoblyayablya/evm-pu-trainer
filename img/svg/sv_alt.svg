<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><defs><marker id="a1b1b1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="130" y="22" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="bold">IBM PC (классика)</text><text x="380" y="22" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="bold">PCI / PCIe, многоядерные x86</text><text x="630" y="22" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="bold">микроконтроллеры ARM, SoC</text><text x="8" y="120" font-size="1" text-anchor="middle" fill="#1b1b1b"></text><text x="14" y="120" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle" transform="rotate(-90 14 120)">Прерывания</text><rect x="24" y="40" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="142.0" y="60.85" font-size="11" text-anchor="middle" fill="#1b1b1b">ВУ: IRQ0–IRQ15</text><line x1="140" y1="74" x2="140" y2="92" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="24" y="92" width="236" height="34" rx="4" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="142.0" y="112.85" font-size="11" text-anchor="middle" fill="#1b1b1b">2 × 8259 (ведущий + ведомый)</text><line x1="140" y1="126" x2="140" y2="144" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="24" y="144" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="142.0" y="164.85" font-size="11" text-anchor="middle" fill="#1b1b1b">ЦП: INTR → INTA, № вектора</text><rect x="274" y="40" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="392.0" y="60.85" font-size="11" text-anchor="middle" fill="#1b1b1b">устройство: MSI — запись сообщения</text><line x1="390" y1="74" x2="390" y2="92" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="274" y="92" width="236" height="34" rx="4" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="392.0" y="112.85" font-size="11" text-anchor="middle" fill="#1b1b1b">в память по шине</text><line x1="390" y1="126" x2="390" y2="144" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="274" y="144" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="392.0" y="164.85" font-size="11" text-anchor="middle" fill="#1b1b1b">LAPIC ядра → обработчик</text><rect x="524" y="40" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="642.0" y="60.85" font-size="11" text-anchor="middle" fill="#1b1b1b">периферия: линии запросов</text><line x1="640" y1="74" x2="640" y2="92" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="524" y="92" width="236" height="34" rx="4" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="642.0" y="112.85" font-size="11" text-anchor="middle" fill="#1b1b1b">NVIC в ядре: приоритеты,</text><line x1="640" y1="126" x2="640" y2="144" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="524" y="144" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="642.0" y="164.85" font-size="11" text-anchor="middle" fill="#1b1b1b">вложенность, таблица векторов</text><text x="14" y="295" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle" transform="rotate(-90 14 295)">ПДП</text><rect x="24" y="215" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="142.0" y="235.85" font-size="11" text-anchor="middle" fill="#1b1b1b">ВУ: DRQ → 8237 (КПДП)</text><line x1="140" y1="249" x2="140" y2="267" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="24" y="267" width="236" height="34" rx="4" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="142.0" y="287.85" font-size="11" text-anchor="middle" fill="#1b1b1b">HOLD/HLDA: КПДП захватывает</text><line x1="140" y1="301" x2="140" y2="319" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="24" y="319" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="142.0" y="339.85" font-size="11" text-anchor="middle" fill="#1b1b1b">шину, ВУ ↔ память</text><rect x="274" y="215" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="392.0" y="235.85" font-size="11" text-anchor="middle" fill="#1b1b1b">контроллер устройства —</text><line x1="390" y1="249" x2="390" y2="267" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="274" y="267" width="236" height="34" rx="4" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="392.0" y="287.85" font-size="11" text-anchor="middle" fill="#1b1b1b">ведущий шины (bus master)</text><line x1="390" y1="301" x2="390" y2="319" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="274" y="319" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="392.0" y="339.85" font-size="11" text-anchor="middle" fill="#1b1b1b">REQ#/GNT#, сам пишет в память</text><rect x="524" y="215" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="642.0" y="235.85" font-size="11" text-anchor="middle" fill="#1b1b1b">многоканальный DMA на</text><line x1="640" y1="249" x2="640" y2="267" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="524" y="267" width="236" height="34" rx="4" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="642.0" y="287.85" font-size="11" text-anchor="middle" fill="#1b1b1b">шине AHB/AXI: дескрипторы,</text><line x1="640" y1="301" x2="640" y2="319" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="524" y="319" width="236" height="34" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="642.0" y="339.85" font-size="11" text-anchor="middle" fill="#1b1b1b">периферия ↔ память без ЦП</text><text x="380" y="385" font-size="12" text-anchor="middle" fill="#868e96">Итог: вместо отдельных микросхем 8259/8237 — APIC, MSI и bus mastering в ПК, NVIC и DMA-контроллеры в SoC</text></svg>