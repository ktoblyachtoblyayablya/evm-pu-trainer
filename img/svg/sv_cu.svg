<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><defs><marker id="a1b1b1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="30" width="110" height="40" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="85.0" y="54.55" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="bold">РК (IR)</text><rect x="30" y="110" width="110" height="56" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="85.0" y="134.88" font-size="12" text-anchor="middle" fill="#1b1b1b">дешифратор</text><text x="85.0" y="149.51999999999998" font-size="12" text-anchor="middle" fill="#1b1b1b">команд</text><line x1="85" y1="70" x2="85" y2="110" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="30" y="220" width="110" height="40" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="85.0" y="244.2" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">RF (флаги)</text><rect x="220" y="20" width="140" height="44" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="290.0" y="38.879999999999995" font-size="12" text-anchor="middle" fill="#1b1b1b">генератор</text><text x="290.0" y="53.519999999999996" font-size="12" text-anchor="middle" fill="#1b1b1b">тактов (CLK)</text><rect x="390" y="20" width="170" height="44" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="475.0" y="38.879999999999995" font-size="12" text-anchor="middle" fill="#1b1b1b">счётчик тактов T1–T6</text><text x="475.0" y="53.519999999999996" font-size="12" text-anchor="middle" fill="#1b1b1b">и циклов M1–M5</text><line x1="360" y1="42" x2="390" y2="42" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><rect x="220" y="100" width="340" height="140" rx="4" fill="#fff1e6" stroke="#e8590c" stroke-width="1.6"/><text x="390.0" y="150.76000000000002" font-size="13" text-anchor="middle" fill="#e8590c" font-weight="bold">Автомат управления</text><text x="390.0" y="166.62" font-size="13" text-anchor="middle" fill="#e8590c">комбинационная схема:</text><text x="390.0" y="182.48000000000002" font-size="13" text-anchor="middle" fill="#e8590c">код команды + номер такта + условия</text><text x="390.0" y="198.34000000000003" font-size="13" text-anchor="middle" fill="#e8590c">→ управляющие сигналы</text><line x1="475" y1="64" x2="475" y2="100" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><line x1="140" y1="138" x2="220" y2="138" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><polyline points="140,240 180,240 180,200 220,200" fill="none" stroke="#1b1b1b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a1b1b1b)"/><line x1="250" y1="300" x2="250" y2="240" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><text x="250" y="318" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">READY</text><line x1="335" y1="300" x2="335" y2="240" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><text x="335" y="318" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">HOLD</text><line x1="420" y1="300" x2="420" y2="240" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><text x="420" y="318" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">INTR</text><line x1="505" y1="300" x2="505" y2="240" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><text x="505" y="318" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">RESET IN</text><line x1="560" y1="140" x2="592" y2="140" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><text x="598" y="134" font-size="12" text-anchor="start" fill="#1b1b1b">внутренние сигналы:</text><text x="598" y="152" font-size="12" text-anchor="start" fill="#868e96">регистры, АЛУ, буферы</text><line x1="560" y1="200" x2="592" y2="200" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><text x="598" y="194" font-size="12" text-anchor="start" fill="#1b1b1b">на шину управления:</text><text x="598" y="212" font-size="12" text-anchor="start" fill="#868e96">RD, WR, ALE, IO/M̄,</text><text x="598" y="228" font-size="12" text-anchor="start" fill="#868e96">S0, S1, INTA, HLDA</text><text x="220" y="280" font-size="12" text-anchor="middle" fill="#1b1b1b"></text></svg>