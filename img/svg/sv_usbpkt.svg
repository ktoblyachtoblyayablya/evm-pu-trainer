<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" width="760" height="405" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><defs><marker id="a1b1b1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="32" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="bold">Маркер (Token): OUT, IN, SETUP — кто и с какой конечной точкой обменивается</text><rect x="30" y="40" width="70.0" height="34" rx="0" fill="#f1f3f5" stroke="#1b1b1b" stroke-width="1.6"/><text x="65.0" y="55" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">SYNC</text><text x="65.0" y="69" font-size="10" text-anchor="middle" fill="#868e96">8 бит</text><rect x="100.0" y="40" width="70.0" height="34" rx="0" fill="#fff1e6" stroke="#1b1b1b" stroke-width="1.6"/><text x="135.0" y="55" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">PID</text><text x="135.0" y="69" font-size="10" text-anchor="middle" fill="#868e96">8 бит</text><rect x="170.0" y="40" width="95.0" height="34" rx="0" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="217.5" y="55" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">ADDR</text><text x="217.5" y="69" font-size="10" text-anchor="middle" fill="#868e96">7 бит</text><rect x="265.0" y="40" width="75.0" height="34" rx="0" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="302.5" y="55" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">ENDP</text><text x="302.5" y="69" font-size="10" text-anchor="middle" fill="#868e96">4 бита</text><rect x="340.0" y="40" width="70.0" height="34" rx="0" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="375.0" y="55" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">CRC5</text><text x="375.0" y="69" font-size="10" text-anchor="middle" fill="#868e96">5 бит</text><rect x="410.0" y="40" width="60.0" height="34" rx="0" fill="#f1f3f5" stroke="#1b1b1b" stroke-width="1.6"/><text x="440.0" y="62" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">EOP</text><text x="30" y="107" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="bold">SOF — начало кадра (каждую 1 мс; микрокадр HS — 125 мкс)</text><rect x="30" y="115" width="70.0" height="34" rx="0" fill="#f1f3f5" stroke="#1b1b1b" stroke-width="1.6"/><text x="65.0" y="130" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">SYNC</text><text x="65.0" y="144" font-size="10" text-anchor="middle" fill="#868e96">8 бит</text><rect x="100.0" y="115" width="70.0" height="34" rx="0" fill="#fff1e6" stroke="#1b1b1b" stroke-width="1.6"/><text x="135.0" y="130" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">PID</text><text x="135.0" y="144" font-size="10" text-anchor="middle" fill="#868e96">8 бит</text><rect x="170.0" y="115" width="170.0" height="34" rx="0" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="255.0" y="130" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">номер кадра</text><text x="255.0" y="144" font-size="10" text-anchor="middle" fill="#868e96">11 бит</text><rect x="340.0" y="115" width="70.0" height="34" rx="0" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="375.0" y="130" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">CRC5</text><text x="375.0" y="144" font-size="10" text-anchor="middle" fill="#868e96">5 бит</text><rect x="410.0" y="115" width="60.0" height="34" rx="0" fill="#f1f3f5" stroke="#1b1b1b" stroke-width="1.6"/><text x="440.0" y="137" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">EOP</text><text x="30" y="182" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="bold">Данные (Data): DATA0 / DATA1 — чередуются для обнаружения повторов</text><rect x="30" y="190" width="70.0" height="34" rx="0" fill="#f1f3f5" stroke="#1b1b1b" stroke-width="1.6"/><text x="65.0" y="205" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">SYNC</text><text x="65.0" y="219" font-size="10" text-anchor="middle" fill="#868e96">8 бит</text><rect x="100.0" y="190" width="70.0" height="34" rx="0" fill="#fff1e6" stroke="#1b1b1b" stroke-width="1.6"/><text x="135.0" y="205" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">PID</text><text x="135.0" y="219" font-size="10" text-anchor="middle" fill="#868e96">8 бит</text><rect x="170.0" y="190" width="260.0" height="34" rx="0" fill="#e7f0fb" stroke="#1b1b1b" stroke-width="1.6"/><text x="300.0" y="205" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">данные</text><text x="300.0" y="219" font-size="10" text-anchor="middle" fill="#868e96">0–1023 байт (FS), до 1024 (HS)</text><rect x="430.0" y="190" width="80.0" height="34" rx="0" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="470.0" y="205" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">CRC16</text><text x="470.0" y="219" font-size="10" text-anchor="middle" fill="#868e96">16 бит</text><rect x="510.0" y="190" width="60.0" height="34" rx="0" fill="#f1f3f5" stroke="#1b1b1b" stroke-width="1.6"/><text x="540.0" y="212" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">EOP</text><text x="30" y="257" font-size="13" text-anchor="start" fill="#1b1b1b" font-weight="bold">Квитирование (Handshake): ACK, NAK, STALL (NYET в HS)</text><rect x="30" y="265" width="70.0" height="34" rx="0" fill="#f1f3f5" stroke="#1b1b1b" stroke-width="1.6"/><text x="65.0" y="280" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">SYNC</text><text x="65.0" y="294" font-size="10" text-anchor="middle" fill="#868e96">8 бит</text><rect x="100.0" y="265" width="70.0" height="34" rx="0" fill="#fff1e6" stroke="#1b1b1b" stroke-width="1.6"/><text x="135.0" y="280" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">PID</text><text x="135.0" y="294" font-size="10" text-anchor="middle" fill="#868e96">8 бит</text><rect x="170.0" y="265" width="60.0" height="34" rx="0" fill="#f1f3f5" stroke="#1b1b1b" stroke-width="1.6"/><text x="200.0" y="287" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold">EOP</text><text x="300" y="306" font-size="12" text-anchor="start" fill="#868e96">PID: 4 бита типа + те же 4 бита инверсно (самоконтроль)</text><rect x="300" y="265" width="50" height="26" rx="0" fill="#fff1e6" stroke="#1b1b1b" stroke-width="1.6"/><text x="325" y="283" font-size="11" text-anchor="middle" fill="#1b1b1b">PID0</text><rect x="350" y="265" width="50" height="26" rx="0" fill="#fff1e6" stroke="#1b1b1b" stroke-width="1.6"/><text x="375" y="283" font-size="11" text-anchor="middle" fill="#1b1b1b">PID1</text><rect x="400" y="265" width="50" height="26" rx="0" fill="#fff1e6" stroke="#1b1b1b" stroke-width="1.6"/><text x="425" y="283" font-size="11" text-anchor="middle" fill="#1b1b1b">PID2</text><rect x="450" y="265" width="50" height="26" rx="0" fill="#fff1e6" stroke="#1b1b1b" stroke-width="1.6"/><text x="475" y="283" font-size="11" text-anchor="middle" fill="#1b1b1b">PID3</text><rect x="500" y="265" width="50" height="26" rx="0" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="525" y="283" font-size="11" text-anchor="middle" fill="#1b1b1b">PID̄0</text><rect x="550" y="265" width="50" height="26" rx="0" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="575" y="283" font-size="11" text-anchor="middle" fill="#1b1b1b">PID̄1</text><rect x="600" y="265" width="50" height="26" rx="0" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="625" y="283" font-size="11" text-anchor="middle" fill="#1b1b1b">PID̄2</text><rect x="650" y="265" width="50" height="26" rx="0" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><text x="675" y="283" font-size="11" text-anchor="middle" fill="#1b1b1b">PID̄3</text><text x="3