="260" y2="458" stroke="#1c6dd0" stroke-width="5"/><text x="268" y="463" font-size="13" text-anchor="start" fill="#1b1b1b">M2, M3 — чтение адреса в W, Z</text><line x1="510" y1="458" x2="540" y2="458" stroke="#2b8a3e" stroke-width="5"/><text x="548" y="463" font-size="13" text-anchor="start" fill="#1b1b1b">проверка Z и переход</text><text x="30" y="490" font-size="13" text-anchor="start" fill="#1b1b1b">① PC → ША (адрес кода);  ② память → РК: код C2;  ③ ДК: нужны ещё 2 байта (адрес перехода)</text><text x="30" y="510" font-size="13" text-anchor="start" fill="#1b1b1b">④ M2: PC → ША, память → Z (04, младший байт);  M3: PC → ША, память → W (10, старший байт)</text><text x="30" y="530" font-size="13" text-anchor="start" fill="#1b1b1b">⑤ автомат управления проверяет флаг Z в регистре признаков RF</text><text x="30" y="550" font-size="13" text-anchor="start" fill="#1b1b1b">⑥ Z = 0 (результат не ноль) → WZ = 1004 → PC, переход;  Z = 1 → PC уже указывает</text><text x="30" y="570" font-size="13" text-anchor="start" fill="#1b1b1b">    на следующую команду (адрес команды + 3), переход не выполняется</text></svg>