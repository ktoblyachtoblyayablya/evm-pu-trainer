troke="#1b1b1b" stroke-width="1.6"/><text x="570" y="126" font-size="14" text-anchor="middle" fill="#1b1b1b" font-weight="bold">c4</text><line x1="210" y1="120" x2="240" y2="120" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><line x1="300" y1="120" x2="318" y2="120" stroke="#1b1b1b" stroke-width="1.6"/><circle cx="330" cy="120" r="12" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/><line x1="318" y1="120" x2="342" y2="120" stroke="#1b1b1b" stroke-width="1.4"/><line x1="330" y1="108" x2="330" y2="132" stroke="#1b1b1b" stroke-width="1.4"/><line x1="342" y1="120" x2="360" y2="120" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><line x1="420" y1="120" x2="450" y2="120" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><line x1="510" y1="120" x2="540" y2="120" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><line x1="600" y1="120" x2="640" y2="120" stroke="#1b1b1b" stroke-width="1.6"/><circle cx="640" cy="120" r="3.2" fill="#1b1b1b"/><line x1="640" y1="120" x2="680" y2="120" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#a1b1b1b)"/><text x="688" y="125" font-size="12" text-anchor="start" fill="#1b1b1b">CRC</text><polyline points="640,120 640,55 110,55 110,108" fill="none" stroke="#1b1b1b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a1b1b1b)"/><text x="380" y="47" font-size="12" text-anchor="middle" fill="#868e96">обратная связь f = d ⊕ c4</text><polyline points="135,120 135,180 330,180 330,132" fill="none" stroke="#1b1b1b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a1b1b1b)"/><text x="232" y="196" font-size="12" text-anchor="middle" fill="#868e96">f → в разряд x²</text><text x="380" y="235" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="bold">USB CRC5: G(x) = x⁵ + x² + 1 (для маркеров);  CRC16: G(x) = x¹⁶ + x¹⁵ + x² + 1 (для данных)</text><text x="380" y="258" font-size="12" text-anchor="middle" fill="#1b1b1b">Передатчик: регистр = 11111, прогоняет поле, CRC = инверсия регистра.</text><text x="380" y="278" font-size="12" text-anchor="middle" fill="#1b1b1b">Приёмник прогоняет поле вместе с CRC: без ошибок остаток постоянен (CRC5 — 01100).</text></svg>